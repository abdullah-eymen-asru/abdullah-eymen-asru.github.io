# Bu workflow'un TEK amacı: Supabase projesinin ücretsiz (free-tier) planda
# ~7 gün API trafiği almadığı için otomatik olarak "pause" (uyku) moduna
# geçmesini engellemek.
#
# SORUN: Proje çoğu zaman sadece kullanıcı giriş/kayıt olduğunda veya panel
# üzerinden içerik yönetildiğinde Supabase'e istek atıyor. Trafiğin az
# olduğu dönemlerde (ör. tatil, düşük ziyaretçi) 7 günlük sessizlik limiti
# dolabilir ve proje duraklatılır — bu da siteye ilk gelen kullanıcının
# giriş/panel işlevlerinin aniden çalışmamasına yol açar.
#
# ÇÖZÜM: Bu workflow haftada bir kez, Supabase REST API kök endpoint'ine
# (`/rest/v1/`) hafif bir GET isteği atıyor.
#
# NEDEN service_role KEY (anon DEĞİL): Supabase, `/rest/v1/` kök
# endpoint'ini (OpenAPI/introspection şeması) SADECE `service_role`
# anahtarıyla erişime açık tutuyor — `anon` key ile bu endpoint HER ZAMAN
# "UNAUTHORIZED_INVALID_API_KEY_TYPE" ile 401 döner, anahtar doğru olsa
# bile (bkz. proje geçmişi: bu hata pratikte doğrulandı). Bu yüzden burada
# İSTİSNAİ olarak service_role kullanılıyor — bu anahtar SADECE GitHub'ın
# şifreli secret deposunda tutuluyor, workflow logunda ASLA görünmüyor
# (--silent) ve hiçbir veri okumuyor/yazmıyor, sadece API'nin ayakta
# olduğunu doğrulayan zararsız bir "yoklama" isteği atıyor.
#
# KURULUM (bir kereye mahsus):
#   GitHub repo -> Settings -> Secrets and variables -> Actions:
#     SUPABASE_URL               = https://<proje-ref>.supabase.co
#     SUPABASE_SERVICE_ROLE_KEY  = (Supabase Dashboard -> Project Settings
#                                    -> API -> "service_role secret" key —
#                                    bu anahtarı ASLA istemci/tarayıcı
#                                    tarafı koduna veya herkese açık bir
#                                    yere koyma, SADECE bu GitHub secret'ı
#                                    içinde kalmalı)

name: Supabase Uyanık Tutma (Haftalık Ping)

on:
  schedule:
    # Her Pazartesi UTC 05:00 (Türkiye Saati ile 08:00).
    # 7 günlük pause limitinin çok altında kalması için haftalık.
    - cron: "0 5 * * 1"
  workflow_dispatch: {}
    # Actions sekmesinden elle "Run workflow" ile de tetiklenebilsin diye.

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gerekli secret'ların tanımlı olduğunu doğrula
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "::error::SUPABASE_URL secret'ı tanımlı değil. Bu dosyanın başındaki kurulum adımlarına bak."
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret'ı tanımlı değil. Bu dosyanın başındaki kurulum adımlarına bak."
            exit 1
          fi

      - name: Supabase REST API'ye hafif GET ping'i gönder
        run: |
          curl "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            --fail --silent --show-error --output /dev/null
